<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0620"/>
      <stop offset="0.55" stop-color="#0c0a22"/>
      <stop offset="1" stop-color="#170f3a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg4)"/>

  <g stroke="#0085FF" stroke-opacity="0.3" stroke-width="2">
    <line x1="1160" y1="130" x2="1240" y2="165"/>
    <line x1="1240" y1="165" x2="1300" y2="120"/>
    <line x1="1090" y1="290" x2="1170" y2="320"/>
    <line x1="1170" y1="320" x2="1240" y2="280"/>
  </g>
  <g fill="#0085FF" fill-opacity="0.7">
    <circle cx="1160" cy="130" r="5"/>
    <circle cx="1240" cy="165" r="5"/>
    <circle cx="1300" cy="120" r="6"/>
    <circle cx="1090" cy="290" r="5"/>
    <circle cx="1170" cy="320" r="6"/>
    <circle cx="1240" cy="280" r="5"/>
    <circle cx="1420" cy="100" r="5"/>
    <circle cx="1400" cy="470" r="5"/>
    <circle cx="1240" cy="700" r="5"/>
  </g>

  <!-- the fraud-ring subgraph: a dense cluster of confirmed-fraud nodes,
       plus a few sparsely-connected legitimate nodes on the outside,
       the exact visual the app itself draws when investigating a case -->
  <g stroke="#5b5f86" stroke-opacity="0.55" stroke-width="3">
    <line x1="470" y1="560" x2="560" y2="600"/>
    <line x1="470" y1="560" x2="520" y2="660"/>
    <line x1="470" y1="560" x2="430" y2="650"/>
    <line x1="560" y1="600" x2="520" y2="660"/>
    <line x1="560" y1="600" x2="620" y2="670"/>
    <line x1="520" y1="660" x2="430" y2="650"/>
    <line x1="520" y1="660" x2="590" y2="730"/>
    <line x1="430" y1="650" x2="380" y2="730"/>
    <line x1="620" y1="670" x2="590" y2="730"/>
  </g>
  <g stroke="#3a3f66" stroke-opacity="0.45" stroke-width="3">
    <line x1="470" y1="560" x2="260" y2="420"/>
    <line x1="560" y1="600" x2="760" y2="470"/>
    <line x1="380" y1="730" x2="200" y2="820"/>
    <line x1="620" y1="670" x2="820" y2="740"/>
  </g>
  <g fill="#E91E8C">
    <circle cx="470" cy="560" r="15"/>
    <circle cx="560" cy="600" r="15"/>
    <circle cx="520" cy="660" r="15"/>
    <circle cx="430" cy="650" r="15"/>
    <circle cx="620" cy="670" r="15"/>
    <circle cx="590" cy="730" r="15"/>
    <circle cx="380" cy="730" r="15"/>
  </g>
  <g fill="#48A8FF">
    <circle cx="260" cy="420" r="12"/>
    <circle cx="760" cy="470" r="12"/>
    <circle cx="200" cy="820" r="12"/>
    <circle cx="820" cy="740" r="12"/>
  </g>

  <!-- magnifying glass over the ring: the detective reading the graph -->
  <g fill="none" stroke="#edeff3" stroke-opacity="0.85" stroke-width="10">
    <circle cx="505" cy="640" r="145"/>
    <line x1="605" y1="740" x2="740" y2="875" stroke-linecap="round"/>
  </g>

  <text x="90" y="985" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="30"
    letter-spacing="4" fill="#E91E8C" font-weight="700">GRAPH NEURAL NETWORK · AML</text>
  <text x="88" y="1058" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#edeff3">Fraud Detective</text>
  <text x="88" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#edeff3">Bitcoin AML · GCN</text>
</svg>
