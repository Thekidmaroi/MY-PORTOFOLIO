<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f28"/>
      <stop offset="0.55" stop-color="#0e1024"/>
      <stop offset="1" stop-color="#1a1d3a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg3)"/>

  <g stroke="#8b7cf6" stroke-opacity="0.3" stroke-width="2">
    <line x1="1160" y1="130" x2="1240" y2="165"/>
    <line x1="1240" y1="165" x2="1300" y2="120"/>
    <line x1="1090" y1="290" x2="1170" y2="320"/>
    <line x1="1170" y1="320" x2="1240" y2="280"/>
  </g>
  <g fill="#8b7cf6" fill-opacity="0.7">
    <circle cx="1160" cy="130" r="5"/>
    <circle cx="1240" cy="165" r="5"/>
    <circle cx="1300" cy="120" r="6"/>
    <circle cx="1090" cy="290" r="5"/>
    <circle cx="1170" cy="320" r="6"/>
    <circle cx="1240" cy="280" r="5"/>
    <circle cx="1420" cy="100" r="5"/>
    <circle cx="1400" cy="470" r="5"/>
    <circle cx="1240" cy="700" r="5"/>
  </g>

  <!-- shield: a fair, auditable tariff -->
  <g fill="none" stroke="#9aa3b2" stroke-opacity="0.5" stroke-width="5">
    <path d="M 220 130 L 300 160 L 300 250 C 300 310 260 345 220 365 C 180 345 140 310 140 250 L 140 160 Z"/>
    <path d="M 185 245 L 210 270 L 258 210" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="#2dd4bf" stroke-opacity="0.85"/>
  </g>

  <!-- four bars: the four pricing methods, ranked -->
  <g>
    <rect x="120" y="770" width="90" height="90" rx="8" fill="none" stroke="#9aa3b2" stroke-opacity="0.6" stroke-width="4"/>
    <rect x="240" y="700" width="90" height="160" rx="8" fill="none" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="4"/>
    <rect x="360" y="620" width="90" height="240" rx="8" fill="none" stroke="#8b7cf6" stroke-opacity="0.7" stroke-width="4"/>
    <rect x="480" y="560" width="90" height="300" rx="8" fill="url(#barGrad)" fill-opacity="0.28" stroke="#f472b6" stroke-opacity="0.9" stroke-width="5"/>
  </g>

  <!-- lorenz-style ranking curve arcing above the bars -->
  <polyline points="120,860 210,650 330,470 450,330 610,250"
    fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <g fill="#edeff3">
    <circle cx="120" cy="860" r="7"/>
    <circle cx="330" cy="470" r="7"/>
    <circle cx="610" cy="250" r="8"/>
  </g>
  <line x1="90" y1="860" x2="700" y2="860" stroke="#9aa3b2" stroke-opacity="0.5" stroke-width="3"/>
  <line x1="90" y1="860" x2="90" y2="520" stroke="#9aa3b2" stroke-opacity="0.5" stroke-width="3"/>

  <text x="90" y="985" font-family="'DejaVu Sans Mono', 'Courier New', monospace" font-size="30"
    letter-spacing="4" fill="#f472b6" font-weight="700">ACTUARIAL PRICING BENCHMARK</text>
  <text x="88" y="1058" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#edeff3">Car Insurance Pricing</text>
  <text x="88" y="1138" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" fill="#edeff3">GLM · GBM · CANN</text>
</svg>
